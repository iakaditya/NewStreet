<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160">
  <!-- White background -->
  <rect width="420" height="160" fill="white"/>

  <!-- "New" text - Deep Navy -->
  <text x="20" y="90" font-family="Arial, sans-serif" font-weight="900" font-size="72" fill="#0B1F4D" letter-spacing="-2">New</text>

  <!-- "Street" text - Civic Green -->
  <text x="155" y="90" font-family="Arial, sans-serif" font-weight="900" font-size="72" fill="#168A4B" letter-spacing="-2">Street</text>

  <!-- Curved road line (navy to green gradient, with orange accent at end) -->
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1F4D"/>
      <stop offset="50%" stop-color="#168A4B"/>
      <stop offset="80%" stop-color="#8B7B40"/>
      <stop offset="100%" stop-color="#F28C28"/>
    </linearGradient>
  </defs>
  <!-- Main curved line -->
  <path d="M20 104 Q 180 85 390 108" fill="none" stroke="url(#roadGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Road dashes on the curve to look like a road -->
  <path d="M20 104 Q 180 85 390 108" fill="none" stroke="white" stroke-width="1" stroke-dasharray="16,12" stroke-linecap="round"/>
  <!-- Orange accent dot at end -->
  <circle cx="390" cy="108" r="4" fill="#F28C28"/>

  <!-- Citizens · Government · Progress row with icons -->
  <g transform="translate(20, 120)">
    <!-- Citizens icon (people) -->
    <circle cx="8" cy="5" r="3" fill="none" stroke="#0B1F4D" stroke-width="1.5"/>
    <path d="M2 14 Q8 10 14 14" fill="none" stroke="#0B1F4D" stroke-width="1.5"/>
    <circle cx="14" cy="5" r="2.5" fill="none" stroke="#0B1F4D" stroke-width="1.2"/>
    <text x="20" y="10" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0B1F4D">Citizens</text>

    <!-- Separator -->
    <line x1="80" y1="3" x2="80" y2="13" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Government icon (building) -->
    <path d="M90 12 L90 6 L98 4 L106 6 L106 12" fill="none" stroke="#168A4B" stroke-width="1.5"/>
    <line x1="87" y1="12" x2="109" y2="12" stroke="#168A4B" stroke-width="1.5"/>
    <text x="114" y="10" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#168A4B">Government</text>

    <!-- Separator -->
    <line x1="190" y1="3" x2="190" y2="13" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Progress icon (bar chart up) -->
    <rect x="200" y="9" width="3" height="4" rx="1" fill="#F28C28"/>
    <rect x="205" y="6" width="3" height="7" rx="1" fill="#F28C28"/>
    <rect x="210" y="3" width="3" height="10" rx="1" fill="#F28C28"/>
    <circle cx="209" cy="3" r="2.5" fill="none" stroke="#F28C28" stroke-width="1.2"/>
    <text x="216" y="10" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#F28C28">Progress</text>
  </g>

  <!-- Tagline bottom -->
  <line x1="20" y1="148" x2="60" y2="148" stroke="#CBD5E1" stroke-width="1"/>
  <text x="62" y="152" font-family="Arial, sans-serif" font-size="8.5" font-weight="600" fill="#94A3B8" letter-spacing="1.5">ONE PLATFORM. EVERY CITIZEN. EVERY SERVICE.</text>
  <line x1="354" y1="148" x2="400" y2="148" stroke="#CBD5E1" stroke-width="1"/>
</svg>
