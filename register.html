<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — New Street</title>
  <meta name="description" content="Create your New Street citizen account." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="register.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

  <main class="auth-container">

    <!-- LEFT PANE -->
    <aside class="auth-left">
      <div class="auth-left-bg"></div>
      <div class="auth-left-overlay"></div>

      <div class="auth-left-content">
        <a href="index.html" class="auth-logo" aria-label="New Street Home">
          <div class="auth-logo-text">
            <span style="color: white;">New</span><span style="color: var(--auth-emerald);">Street</span>
          </div>
        </a>

        <div class="auth-hero-text">
          <h1 class="auth-headline">
            A complaint is<br />
            not a solution,<br />
            <span>A response is</span>
          </h1>
          <p class="auth-desc">
            Join New Street and connect directly with your government.
          </p>
        </div>
      </div>

      <div class="auth-trust-badge">
        <div class="auth-trust-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <path d="M9 12l2 2 4-4"></path>
          </svg>
        </div>
        <div class="auth-trust-text">
          Secure - Transparent - Accountable<br />
          Building better cities together
        </div>
      </div>
    </aside>

    <!-- RIGHT PANE -->
    <section class="auth-right">

      <div class="auth-top-nav">
        Already have an account? <a href="login.html">Login</a>
      </div>

      <div class="auth-card" style="margin-top: 40px; margin-bottom: 40px;">
        <div class="auth-header">
          <h2 class="auth-title">Create Account</h2>
          <p class="auth-subtitle">Be a part of the change. Register with New Street.</p>
        </div>

        <form action="dashboard.html" method="GET">

          <div class="auth-form-group">
            <input type="text" id="regName" class="auth-input" placeholder=" " required />
            <label class="auth-floating-label" for="regName">Full Name</label>
            <div class="auth-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
          </div>

          <div class="auth-form-group">
            <input type="email" id="regEmail" class="auth-input" placeholder=" " required />
            <label class="auth-floating-label" for="regEmail">Email Address</label>
            <div class="auth-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </div>
          </div>

          <div class="auth-form-group" style="margin-bottom: 32px;">
            <div class="auth-mobile-group">
              <select class="auth-select" aria-label="Country Code">
                <option value="+91">+91</option>
                <option value="+1">+1</option>
                <option value="+44">+44</option>
              </select>
              <div style="flex: 1; position: relative;">
                <input type="tel" id="regMobile" class="auth-input" placeholder=" " required />
                <label class="auth-floating-label" for="regMobile">Mobile Number</label>
                <div class="auth-input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                      d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                    </path>
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <div class="auth-form-group">
            <input type="password" id="regPassword" class="auth-input" placeholder=" " required />
            <label class="auth-floating-label" for="regPassword">Password</label>
            <div class="auth-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            <button type="button" class="auth-pwd-toggle" aria-label="Toggle password visibility">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <div class="auth-form-group">
            <input type="password" id="regConfirm" class="auth-input" placeholder=" " required />
            <label class="auth-floating-label" for="regConfirm">Confirm Password</label>
            <div class="auth-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            <button type="button" class="auth-pwd-toggle" aria-label="Toggle password visibility">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <div class="auth-form-group">
            <div style="display: flex; gap: 12px; align-items: center;">
              <div style="flex: 1; position: relative;">
                <select id="regCity" class="auth-select-full no-floating-label" required>
                  <option value="" disabled selected>Select your city</option>
                  <option value="vadodara">Vadodara</option>
                  <option value="mumbai">Mumbai</option>
                  <option value="delhi">Delhi</option>
                  <option value="bangalore">Bangalore</option>
                </select>
                <div class="auth-input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                  </svg>
                </div>
              </div>
              <button type="button" id="detectLocationBtn" class="auth-btn-outline" style="width: auto; padding: 16px; margin: 0; display: flex; align-items: center; justify-content: center;" title="Detect My Location">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <circle cx="12" cy="12" r="3"></circle>
                  <line x1="12" y1="2" x2="12" y2="4"></line>
                  <line x1="12" y1="20" x2="12" y2="22"></line>
                  <line x1="2" y1="12" x2="4" y2="12"></line>
                  <line x1="20" y1="12" x2="22" y2="12"></line>
                </svg>
              </button>
            </div>
            <div id="locationStatus" style="font-size: 0.8rem; color: var(--auth-emerald); margin-top: 8px; display: none;"></div>
          </div>

          <div class="auth-flex-row" style="margin-bottom: 24px; justify-content: flex-start;">
            <label class="auth-checkbox-label">
              <input type="checkbox" class="auth-checkbox" required />
              <span>I agree to the <a href="#" class="auth-link">Terms</a> & <a href="#" class="auth-link">Privacy
                  Policy</a></span>
            </label>
          </div>

          <button type="submit" class="auth-btn-primary">
            Register
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </button>

          <div class="auth-divider">OR</div>

          <button type="button" class="auth-btn-outline" onclick="window.location.href='dashboard.html'">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" />
            Continue with Google
          </button>
        </form>
      </div>

    </section>
  </main>

  <script>
    // Form Validation
    const regForm = document.querySelector('form');
    if (regForm) {
      regForm.addEventListener('submit', (e) => {
        const pwd = document.getElementById('regPassword').value;
        const confirmPwd = document.getElementById('regConfirm').value;
        if (pwd !== confirmPwd) {
          e.preventDefault();
          alert('Passwords do not match. Please try again.');
          return false;
        }
        localStorage.setItem('userName', document.getElementById('regName').value);
      });
    }

    // Simple Password Toggles
    const toggleBtns = document.querySelectorAll('.auth-pwd-toggle');
    toggleBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const input = e.currentTarget.parentElement.querySelector('input');
        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
        input.setAttribute('type', type);
        if (type === 'text') {
          btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
        } else {
          btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        }
      });
    });

    // Location Detection
    const detectLocationBtn = document.getElementById('detectLocationBtn');
    const locationStatus = document.getElementById('locationStatus');
    const regCity = document.getElementById('regCity');

    if (detectLocationBtn) {
      detectLocationBtn.addEventListener('click', () => {
        if (!navigator.geolocation) {
          locationStatus.textContent = "Geolocation is not supported by your browser";
          locationStatus.style.color = "red";
          locationStatus.style.display = "block";
          return;
        }

        locationStatus.textContent = "Detecting location...";
        locationStatus.style.color = "var(--auth-text-secondary)";
        locationStatus.style.display = "block";

        navigator.geolocation.getCurrentPosition(
          async (position) => {
            try {
              const { latitude, longitude } = position.coords;
              const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
              const data = await response.json();
              
              const city = data.address.city || data.address.town || data.address.village || data.address.county || data.address.state || "";
              if (city) {
                locationStatus.textContent = `Location detected: ${city}`;
                locationStatus.style.color = "var(--auth-emerald)";
                
                const options = Array.from(regCity.options);
                const matchedOption = options.find(opt => opt.text.toLowerCase().includes(city.toLowerCase()) || city.toLowerCase().includes(opt.text.toLowerCase()));
                
                if (matchedOption) {
                  regCity.value = matchedOption.value;
                } else {
                  const newOption = new Option(city, city.toLowerCase());
                  regCity.add(newOption);
                  regCity.value = city.toLowerCase();
                }
              } else {
                locationStatus.textContent = "Could not resolve city from location.";
                locationStatus.style.color = "red";
              }
            } catch (error) {
              locationStatus.textContent = "Error fetching location details.";
              locationStatus.style.color = "red";
            }
          },
          (error) => {
            locationStatus.textContent = "Unable to retrieve your location.";
            locationStatus.style.color = "red";
          }
        );
      });
    }
  </script>
</body>

</html>
